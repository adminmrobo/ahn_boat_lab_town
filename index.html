<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahn Lab Town</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Header (language picker top) → lab stats → the walkable lab (camera follows you; dialogue top-left, info top-right on wide screens, stacked below on phones; countdown and result cards over the map) → experiment console → log → footer (language picker bottom). Night-lab palette from the map; single dark theme by choice. */
:root{
  --bg:#12101c; --panel:#1b1729; --panel-2:#2a1f3d; --line:#3a2f55;
  --fg:#eeeaf8; --muted:#a59dc2; --cyan:#4de0d0; --magenta:#d0449a; --amber:#e8a24b; --alarm:#e02a3c; --gold:#ffcf4a;
  --todo:#e8a24b; --doing:#4de0d0; --done:#b59bff;
  --display:"Do Hyeon","IBM Plex Sans KR","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1440px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button,select{font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.top a{color:var(--muted);text-decoration:none}.top a:hover{color:var(--fg)}
.top .r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.proto{font-family:var(--mono);font-size:12px;border:1px dashed var(--line);border-radius:999px;padding:3px 12px}
.langsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.langsel select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:5px 28px 5px 10px;font-size:13px;cursor:pointer}
.langsel select:hover{border-color:var(--cyan)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;font-size:clamp(30px,5vw,46px);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px}
.lead{color:var(--muted);margin:6px 0 0;max-width:72ch}
.lead b{color:var(--fg);font-weight:500}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);line-height:1.35}
.stat .v{font-family:var(--display);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat.acc{border-color:#5a2433}.stat.acc .v{color:#ff7584}
.stat.jack{border-color:#5a4a1c}.stat.jack .v{color:var(--gold)}
.stat .s{font-size:11px;color:var(--muted);font-family:var(--mono)}
.stat .w{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bump{animation:bump .5s ease}
@keyframes bump{30%{transform:scale(1.18)}}

.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none}
.nbtn:hover{border-color:var(--cyan)}
.nbtn.hl{border-color:var(--amber);color:#ffd59a}
.nbtn img{width:22px;height:22px;object-fit:contain}
.ost{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.ost .nbtn[aria-pressed="true"]{border-color:var(--cyan);background:#173a3a}
.ost .nbtn:disabled{opacity:.45;cursor:default}
.ost input{width:86px;accent-color:var(--cyan)}
.ostNow{font-size:12px;color:var(--muted);font-family:var(--mono);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.soon{font-size:11px;font-family:var(--mono);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.picker{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pick{display:inline-flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:2px 10px 2px 3px;font-size:13px;cursor:pointer}
.pick img{width:26px;height:26px;object-fit:contain}
.pick[aria-pressed="true"]{border-color:var(--cyan);background:#173a3a}

.game{position:relative;border:3px solid #2a1f3d;border-radius:14px;overflow:hidden;background:#0d0b16}
.game canvas{display:block;width:100%;touch-action:none;cursor:pointer}
.game.alarm{border-color:var(--alarm)}
.game.alarm canvas{animation:shake .32s linear infinite}
.game.gold{border-color:var(--gold)}
@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
@media (prefers-reduced-motion:reduce){.game.alarm canvas{animation:none}.bump{animation:none}.cd .n{animation:none}}
.ctrl{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.ctrl>*{pointer-events:auto}
.act{margin-left:auto;font-family:var(--display);font-size:19px;background:var(--cyan);color:#0a2622;border:0;border-radius:12px;padding:8px 16px;box-shadow:0 3px 0 #23988b;cursor:pointer}
.act:disabled{background:#2a1f3d;color:var(--muted);box-shadow:0 3px 0 #1b1729;cursor:default}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:2px}
.pad button{background:rgba(42,31,61,.9);border:1px solid var(--line);color:var(--fg);border-radius:8px;font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
@media (pointer:coarse) and (min-width:900px){.dlg{bottom:160px}}
@media (pointer:coarse){.keys{display:none}}
.keys{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--fg);background:var(--panel)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(18,16,28,.94);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;z-index:6}
.toast.bad{border-color:var(--alarm);color:#ffb3ba}
.toast.good{border-color:var(--cyan);color:#b8fff6}
.toast.jack{border-color:var(--gold);color:#ffe9a6}

/* countdown */
.cd{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5;background:radial-gradient(circle at 50% 50%,rgba(18,16,28,.15),rgba(18,16,28,.55))}
.cd .box{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:0 16px}
.cd .l{font-size:14px;color:var(--muted);background:rgba(18,16,28,.85);border:1px solid var(--line);border-radius:999px;padding:3px 14px}
.cd .e{font-family:var(--display);font-size:20px;color:#ffd59a;text-shadow:0 2px 8px #000}
.cd .n{font-family:var(--display);font-size:clamp(90px,16vw,170px);line-height:1;color:#fff;text-shadow:0 0 24px rgba(232,162,75,.9),0 4px 0 #a86a20;animation:pop .9s ease-out}
.cd .n.go{color:var(--gold);font-size:clamp(60px,10vw,110px)}
@keyframes pop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}100%{transform:scale(.92);opacity:.95}}

/* result card */
.res{position:absolute;inset:0;display:grid;place-items:center;padding:16px;z-index:5;background:rgba(10,6,14,.38)}
.res figure{margin:0;width:min(560px,92%);display:flex;flex-direction:column;gap:8px;align-items:center;background:rgba(18,16,28,.94);border:2px solid var(--alarm);border-radius:14px;padding:12px}
.res.gold figure{border-color:var(--gold);box-shadow:0 0 40px rgba(255,207,74,.35)}
.res img{width:100%;max-height:min(44vh,320px);object-fit:contain;border-radius:8px}
.res figcaption{font-family:var(--display);font-size:22px;text-align:center;line-height:1.3}
.res .tag{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:#ff8f99}
.res.gold .tag{color:var(--gold)}
.res .bar{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.res .bar i{display:block;height:100%;width:100%;background:var(--alarm);transform-origin:left;animation:drain 3s linear forwards}
.res.gold .bar i{background:var(--gold)}
.res .meta{font-size:12px}
@keyframes drain{to{transform:scaleX(0)}}

.panel{background:rgba(27,23,41,.96);border:1px solid var(--line);border-radius:14px;padding:14px 16px;z-index:3}
.dlg{position:absolute;left:12px;bottom:72px;width:min(560px,54%);display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.dlg .pt{width:96px;height:112px;background:var(--panel-2);border-radius:10px;display:grid;place-items:center;overflow:hidden}
.dlg .pt img{width:100%;height:100%;object-fit:cover;object-position:top}
.dlg .pt img{max-width:92%;max-height:92%;object-fit:contain}
.dlg .nm{font-family:var(--display);font-size:20px;line-height:1.1}
.dlg .rl{font-size:12px;color:var(--muted)}
.dlg .ex{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:#ffd59a;white-space:nowrap}
.dlg .pt{position:relative}
.dlg .pt img{transition:transform .18s}
.dlg .pt img.pop{animation:ptpop .35s ease}
@keyframes ptpop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.egrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.egrid button{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;min-width:0}
.egrid button:hover,.egrid button[aria-pressed="true"]{border-color:#ffd59a}
.egrid img{width:100%;max-width:64px;aspect-ratio:1;border-radius:8px;object-fit:cover}
.egrid span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.dlg .pt img.pop{animation:none}}
.dlg .tx{font-size:15px;margin:6px 0 8px;min-height:3.2em}
.dlg .bt{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.info{position:absolute;right:12px;top:12px;width:min(400px,42%);max-height:calc(100% - 24px);overflow:auto}
.x{float:right;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer;margin:-4px -6px 0 8px}
.x:hover{color:var(--fg);border-color:var(--cyan)}
.info h3{margin:2px 0 6px;font-size:18px;line-height:1.35}
.info .hero{display:block;width:100%;max-height:220px;object-fit:contain;margin:6px 0 10px}
.meta{font-size:13px;color:var(--muted)}
.badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid currentColor;letter-spacing:.06em}
.b-todo{color:var(--todo)}.b-doing{color:var(--doing)}.b-done{color:var(--done)}.b-alarm{color:#ff6b78}.b-gold{color:var(--gold)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--doing)}
.items{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:7px}
.items li{font-size:14px;line-height:1.45}
.items .who{display:block;font-size:12px;color:var(--muted)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--cyan);margin:14px 0 2px;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;text-decoration:none;color:var(--fg);background:var(--panel-2);cursor:pointer}
.btn:hover{border-color:var(--cyan)}
.btn.pri{background:var(--cyan);color:#0a2622;border-color:var(--cyan);font-weight:500}
.btn.big{width:100%;padding:11px 12px;font-size:14px;justify-content:flex-start;text-align:left}
.btn.big img{width:34px;height:34px;object-fit:contain;flex:0 0 34px}
.links{display:grid;gap:8px;margin-top:8px}
.items.srv li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:11px;font-family:var(--mono);border:1px solid var(--line);border-radius:999px;padding:0 7px;color:#cfe9ff}
.elev{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;z-index:7;background:#14161f;border:2px solid #5a6278;border-radius:16px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.ehead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.ehead b{font-size:15px}
.emsg{font-size:13px;color:#ff8f99;min-height:1.3em}
.led{font-family:var(--mono);font-weight:500;font-size:22px;color:#ffb347;background:#07080c;border:1px solid #3a2a12;border-radius:8px;padding:2px 12px;text-shadow:0 0 8px rgba(255,179,71,.7);min-width:64px;text-align:center}
.floors{display:grid;gap:6px}
.fl{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:#1d2130;border:1px solid #3a4258;border-radius:10px;padding:7px 10px;color:var(--fg);cursor:pointer}
.fl .code{font-family:var(--mono);font-size:15px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid #5a6278;background:#262b3b}
.fl .fn{font-size:14px}
.fl .st{font-size:11px;color:var(--muted);text-align:right}
.fl:hover{border-color:var(--cyan)}
.fl.cur{border-color:#ffb347}.fl.cur .code{border-color:#ffb347;color:#ffb347;box-shadow:0 0 10px rgba(255,179,71,.5)}
.fl.lock{opacity:.6}.fl.lock .st{color:#ff8f99}
.fl.no{animation:no .35s}
@keyframes no{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.trans{position:absolute;inset:0;z-index:8;background:#05060a;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center;padding:16px}
.trans.in{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}}
.led.big{font-size:56px;padding:6px 26px;min-width:150px}
@media (max-width:899px){
  .dlg,.info{position:static;width:auto;max-height:none;margin-top:10px;background:var(--panel)}
}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
  .ctrl{position:static;padding:10px;background:var(--panel);border-top:2px solid #2a1f3d}
  .act{font-size:16px;padding:8px 12px}
  .stat{padding:8px 10px}.stat .v{font-size:24px}
  .dlg{grid-template-columns:72px minmax(0,1fr)}.dlg .pt{width:72px;height:88px}
  .res figcaption{font-size:18px}
}

.console{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.evs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ev{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;color:var(--fg);cursor:pointer;min-width:0}
.ev img{width:40px;height:40px;object-fit:contain;flex:0 0 40px}
.ev b{display:block;font-size:14px;font-weight:500;line-height:1.35}
.ev small{display:block;font-size:12px;color:var(--muted)}
.ev[aria-pressed="true"]{border-color:var(--amber);background:#3a2a1d}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.lvl input{width:100%;accent-color:var(--amber)}
.lvl output{font-family:var(--mono);font-size:13px;white-space:nowrap}
.run{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.go{font-family:var(--display);font-size:22px;background:var(--amber);color:#2b1606;border:0;border-radius:12px;padding:10px 22px;box-shadow:0 3px 0 #a86a20;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
.risk{font-size:13px;color:var(--muted)}
.risk b{color:#ffb15c;font-family:var(--mono)}
@media (max-width:820px){.evs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.evs{grid-template-columns:1fr}.lvl{grid-template-columns:1fr}}

details.log{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
details.log summary{cursor:pointer;padding:10px 0;font-family:var(--display);font-size:20px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding-bottom:14px}
.col h4{margin:0 0 8px;font-size:14px;display:flex;gap:6px;align-items:center}
.col ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.col li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.col li small{display:block;color:var(--muted);font-size:12px}
@media (max-width:720px){.board{grid-template-columns:1fr}}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
</style>

<div class="wrap">
  <div class="top">
    <a href="https://ahnboat.xyz/">← Reon Ahn's page</a>
    <div class="r">
      <span class="proto" data-i18n="proto"></span>
      <label class="langsel"><span aria-hidden="true">🌐</span><span class="sr" data-i18n="lang"></span><select id="langTop" aria-label="Language"></select></label>
    </div>
  </div>

  <header>
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p class="lead" data-i18n-html="lead"></p>
  </header>

  <section class="stats" aria-label="stats">
    <div class="stat"><div class="k" data-i18n="st_clicks"></div><div class="v" id="sClicks">0</div><div class="s" id="sMode"></div></div>
    <div class="stat acc"><div class="k" data-i18n="st_acc"></div><div class="v" id="sAcc">0</div><div class="s" id="sRate"></div></div>
    <div class="stat jack"><div class="k" data-i18n="st_jack"></div><div class="v" id="sJack">0</div><div class="s" id="sJRate"></div></div>
    <div class="stat"><div class="k" data-i18n="st_work"></div><div class="w" id="sWork"></div><div class="s" id="sMine"></div></div>
  </section>

  <div class="toolbar">
    <div class="nav">
      <button class="nbtn hl" id="goDoc"><img src="assets/pose/doc_ok.webp" alt=""><span data-i18n="nav_doc"></span></button>
      <button class="nbtn hl" id="goRes"><span data-i18n="nav_res"></span></button>
      <a class="nbtn hl" href="projects.html"><span data-i18n="nav_proj"></span></a>
      <button class="nbtn hl" id="goElev"><span data-i18n="el_btn"></span></button>

function pjDecode(buf){
  const u8=new Uint8Array(buf);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u8).replace(/^﻿/,""); }
  catch(e){ try{ return new TextDecoder("euc-kr").decode(u8); }catch(e2){ return new TextDecoder().decode(u8); } }
}
function pjParseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function pjDate(s){
  s=String(s||"").trim(); if(!s) return null;
  const m=s.match(/^(\d{4})[-./년\s]*(\d{1,2})[-./월\s]*(\d{1,2})/); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d;
}
const pjISO=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:"";
function pjOwner(s){
  s=String(s||"").trim().toLowerCase();
  if(/조수|조교|asst|assistant/.test(s)) return "asst";
  if(/초파리|fly/.test(s)) return "fly";
  if(/robo|로보|money/.test(s)) return "robo";
  return "doc";
}
function pjStatus(s){
  s=String(s||"").replace(/\s/g,"").toLowerCase();
  if(/완료|done|complete|finished/.test(s)) return "done";
  if(/진행|doing|progress|wip/.test(s)) return "doing";
  if(/예정|todo|plan|schedul|준비/.test(s)) return "todo";
  return "";
}
function pjBuild(text){
  const rows=pjParseCSV(text); if(rows.length<2) return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col={}; for(const k in PJ_HEAD) col[k]=head.findIndex(h=>PJ_HEAD[k].some(a=>a.toLowerCase()===h));
  const tr={}; PJ_LANGS.forEach(l=>{ tr[l]=head.findIndex(h=>h==="프로젝트명_"+l||h==="name_"+l); });
  const today=new Date(); today.setHours(0,0,0,0);
  const out=[];
  rows.slice(1).forEach((r,i)=>{
    const g=k=>col[k]>=0?String(r[col[k]]??"").trim():"";
    const name=g("name"); if(!name) return;
    const start=pjDate(g("start")), end=pjDate(g("end"));
    let status=pjStatus(g("status"));
    if(!status){ status = end&&end<today ? "done" : start&&start>today ? "todo" : (start||end) ? "doing" : "todo"; }
    let progress=g("progress")!==""? Math.max(0,Math.min(100,parseFloat(g("progress"))||0)) : null;
    if(progress==null){
      if(status==="done") progress=100;
      else if(status==="doing"&&start&&end&&end>start) progress=Math.round(Math.max(0,Math.min(1,(today-start)/(end-start)))*100);
    }
    const i18n={}; PJ_LANGS.forEach(l=>{ if(tr[l]>=0&&String(r[tr[l]]||"").trim()) i18n[l]={title:String(r[tr[l]]).trim()}; });
    out.push({id:"p"+(i+1),status,category:g("category"),title:name,link:g("link"),start,end,owner:pjOwner(g("owner")),ownerRaw:g("owner"),progress,note:g("note"),i18n});
  });
  return out;
}
async function pjLoad(url,fallback){

}

}

  const rows=pjParseCSV(text); if(rows.length<2) return [];
  const head=rows[0].map(h=>h.trim().toLowerCase()); const col={};
  for(const k in SV_HEAD) col[k]=head.findIndex(h=>SV_HEAD[k].some(a=>a.toLowerCase()===h));
  // optional translations: <Korean or English column name>_<lang>, e.g. 제목_en, 내용소개_ja, title_zh
  const tcol={}; for(const k in SV_HEAD){ tcol[k]={}; ["en","zh","ja","uz","ru"].forEach(l=>{ tcol[k][l]=head.findIndex(h=>SV_HEAD[k].some(a=>(a.toLowerCase()+"_"+l)===h)); }); }
  const splitTags=s=>String(s||"").split(/[\s,]+/).filter(Boolean).map(t=>t.startsWith("#")?t:"#"+t);
  const order=[], map={};
  rows.slice(1).forEach(r=>{
    const g=k=>col[k]>=0?String(r[col[k]]??"").trim():"";
    const gt=(k,l)=>tcol[k][l]>=0?String(r[tcol[k][l]]??"").trim():"";
    const title=g("title"), cat=g("cat")||"—"; if(!title) return;
    if(!map[cat]){ map[cat]={name:cat,tr:{},items:[]}; order.push(cat); }
    const tr={};
    ["en","zh","ja","uz","ru"].forEach(l=>{
      const c=gt("cat",l); if(c&&!map[cat].tr[l]) map[cat].tr[l]=c;
      const e={title:gt("title",l),desc:gt("desc",l),tags:gt("tags",l)?splitTags(gt("tags",l)):null,note:gt("note",l)};
      if(e.title||e.desc||e.tags||e.note) tr[l]=e;
    });
    map[cat].items.push({title,desc:g("desc"),tags:splitTags(g("tags")),date:g("date"),note:g("note"),tr});
  });
  return order.slice(0,10).map(c=>map[c]);
}
const svT=(o,f)=>{ const t=o.tr&&o.tr[lang]; return (t&&t[f]&&(Array.isArray(t[f])?t[f].length:true))? t[f] : o[f]; };
const catName=c=>(c.tr&&c.tr[lang])||c.name;
// a bare repo address (…/owner/repo) is expanded to its servers.csv on main, then master
function svExpand(u){
  if(!u) return [];
  u=u.trim().replace(/\/+$/,"");
  if(/\.csv(\?.*)?$/i.test(u)) return [u];
  return [u+"/main/servers.csv",u+"/master/servers.csv"];
}
async function svLoad(urls,fallback){
  urls=urls.flatMap(u=>/^https?:/i.test(u||"")?svExpand(u):[u]);
  for(const u of urls){ if(!u) continue; try{ const r=await fetch(u,{cache:"no-store"}); if(r.ok){ const c=svBuild(pjDecode(await r.arrayBuffer())); if(c.length) return {cats:c,ok:true}; } }catch(e){} }
  return {cats:svBuild(fallback),ok:false};
}

/* ======================================================================
   OST: one playlist per space (1F lab, B1 server room), played in order and looped.
   Playlist = ost/ost.csv  →  공간 / 순서 / 제목 / 파일 / 비고
   ====================================================================== */
const OST={pl:{},idx:{},on:false,scene:"F1",fails:0,vol:.5,title:""};
const au=new Audio(); au.preload="auto";
try{ OST.on=localStorage.getItem("alt_ost")==="1"; const v=parseFloat(localStorage.getItem("alt_ost_vol")); if(v>=0&&v<=1) OST.vol=v; }catch(e){}
function ostSpace(s){
  s=String(s||"").replace(/\s/g,"").toUpperCase();
  if(/^(B1|지하1층?|서버실)/.test(s)||s.includes("서버")) return "B1";
  if(/^(1F|F1|1층|1|연구실)/.test(s)||s.includes("연구실")) return "F1";
  return s;
}
async function ostLoad(url){
  try{
    const r=await fetch(url,{cache:"no-store"}); if(!r.ok) return;
    const rows=pjParseCSV(pjDecode(await r.arrayBuffer())); if(rows.length<2) return;
    const head=rows[0].map(h=>h.trim().toLowerCase());
    const ci=(...names)=>head.findIndex(h=>names.includes(h));
    const cS=ci("공간","층","space","floor"), cO=ci("순서","order","no"), cT=ci("제목","title","곡명"), cF=ci("파일","file","url","파일명");
    const base=new URL(url,location.href);
    rows.slice(1).forEach((row,i)=>{
      const file=String(row[cF]??"").trim(); if(!file) return;
      const sp=ostSpace(row[cS]); (OST.pl[sp]=OST.pl[sp]||[]).push({order:parseFloat(row[cO])||i+1,title:String(row[cT]??"").trim()||file,src:new URL(file,base).href});
    });
    for(const k in OST.pl){ OST.pl[k].sort((a,b)=>a.order-b.order); OST.idx[k]=0; }
  }catch(e){}
}
let fadeTimer=null;
function fadeTo(v,ms=600){
  clearInterval(fadeTimer);
  return new Promise(res=>{ const from=au.volume, t0=performance.now();
    fadeTimer=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/ms); au.volume=Math.max(0,Math.min(1,from+(v-from)*k)); if(k>=1){ clearInterval(fadeTimer); res(); } },30); });
}
function ostUI(){
  const b=document.getElementById("ostBtn"), now=document.getElementById("ostNow"), nx=document.getElementById("ostNext");
  if(!b) return;
  b.textContent=T(OST.on?"ost_off":"ost_on"); b.setAttribute("aria-pressed",OST.on);
  nx.title=T("ost_next"); nx.setAttribute("aria-label",T("ost_next"));
  document.getElementById("ostVol").setAttribute("aria-label",T("ost_vol"));
  const list=OST.pl[OST.scene]||[];
  now.textContent = !list.length ? T("ost_none") : OST.on&&OST.title ? T("ost_now",{t:OST.title}) : "";
  nx.disabled=!OST.on||list.length<2;
}
function ostPlay(){
  const list=OST.pl[OST.scene]||[];
  if(!OST.on||!list.length){ au.pause(); OST.title=""; ostUI(); return; }
  const tr=list[(OST.idx[OST.scene]||0)%list.length];
  OST.title=tr.title; au.src=tr.src; au.volume=0;
  au.play().then(()=>fadeTo(OST.vol)).catch(()=>{});
  ostUI();
}
au.addEventListener("ended",()=>{ OST.idx[OST.scene]=(OST.idx[OST.scene]||0)+1; ostPlay(); });
au.addEventListener("playing",()=>{ OST.fails=0; });
au.addEventListener("error",()=>{ const n=(OST.pl[OST.scene]||[]).length; if(++OST.fails<n*2){ OST.idx[OST.scene]=(OST.idx[OST.scene]||0)+1; ostPlay(); } });
async function ostScene(id){
  if(OST.scene===id) return; OST.scene=id;
  if(OST.on&&!au.paused){ await fadeTo(0,450); } ostPlay();
}
function ostToggle(){
  OST.on=!OST.on; try{localStorage.setItem("alt_ost",OST.on?"1":"0")}catch(e){}
  if(OST.on) ostPlay(); else fadeTo(0,400).then(()=>{ au.pause(); OST.title=""; ostUI(); });
  ostUI();
}
function ostBind(){
  document.getElementById("ostBtn").addEventListener("click",ostToggle);
  document.getElementById("ostNext").addEventListener("click",async()=>{ OST.idx[OST.scene]=(OST.idx[OST.scene]||0)+1; await fadeTo(0,300); ostPlay(); });
  const vol=document.getElementById("ostVol"); vol.value=OST.vol;

/* ======================================================================
   expressions (fruitfly-lab-expressions repo): 24 per character
   portraits: assets/expr/{k}_{E}.webp · faces: assets/expr/{k}_{E}_f.webp
   ====================================================================== */
const exprPortrait=(k,e)=>`${A}expr/${k}_${e}.webp`;
const exprFace=(k,e)=>`${A}expr/${k}_${e}_f.webp`;
const exprName=e=>L(EXPR_NAME[+e.slice(1)-1]);
const exprLine=(k,e)=>L(EXPR_LINE[k][+e.slice(1)-1]);
// which expression goes with each scripted dialogue pose
const TALK_EXPR={doc_ok:"E13",doc_write:"E07",doc_think:"E09",doc_flask:"E16",doc_data:"E08",doc_rush:"E05",doc_sleep:"E17",
  asst_wave:"E13",asst_type:"E20",asst_think:"E09",asst_idea:"E04",asst_check:"E10",asst_present:"E08",asst_cheer:"E12",
  fly_hover:"E13",fly_scan:"E09",fly_analyze:"E07",fly_report:"E10",fly_idea:"E16",fly_panic:"E05",
  robo_search:"E13",robo_scan:"E09",robo_alert:"E05",robo_lock:"E10",robo_delivery:"E08",robo_battery:"E17",robo_dance:"E01"};
function talkExpr(k,pose,text){
  const ko=(text&&text.ko)||"";
  if(pose==="asst_type"&&ko.includes("텔레그램")) return "E19";
  if(pose==="robo_lock"&&ko.includes("던전")) return "E20";
  if(pose==="doc_data"&&ko.includes("결과물 {done}")) return "E10";
  return TALK_EXPR[pose]||"E13";
}
// map sprite pose that best fits an expression
const MOOD={happy:["E01","E10","E12","E14","E16","E19"],down:["E02","E05","E15","E20","E21","E24"],cross:["E03","E06","E18","E22"],talk:["E07","E08"],calm:["E09","E11","E13","E23"],sleep:["E17"],wow:["E04"]};
const MOOD_POSE={happy:{doc:"doc_ok",asst:"asst_cheer",fly:"fly_idea",robo:"robo_dance"},down:{doc:"doc_rush",asst:"asst_think",fly:"fly_panic",robo:"robo_alert"},cross:{doc:"doc_think",asst:"asst_think",fly:"fly_scan",robo:"robo_alert"},talk:{doc:"doc_write",asst:"asst_present",fly:"fly_analyze",robo:"robo_delivery"},calm:{doc:"doc_think",asst:"asst_think",fly:"fly_scan",robo:"robo_search"},sleep:{doc:"doc_sleep",asst:"asst_think",fly:"fly_hover",robo:"robo_battery"},wow:{doc:"doc_flask",asst:"asst_idea",fly:"fly_idea",robo:"robo_scan"}};
const poseForExpr=(k,e)=>{ for(const m in MOOD) if(MOOD[m].includes(e)) return MOOD_POSE[m][k]; return CREW[k].base; };

/* emote balloons over heads */
const EMOTE={};               // k -> {e, until}
const FACE={};                // cached face images
function face(k,e){ const key=k+e; if(!FACE[key]){ const i=new Image(); i.src=exprFace(k,e); FACE[key]=i; } return FACE[key]; }
function emote(k,e,sec=2.6){ EMOTE[k]={e,until:now()+sec,at:now()}; face(k,e); }
function emoteAll(map,sec){ for(const k in map) emote(k,map[k],sec); }
function drawEmote(g,k,x,y,t){
  const em=EMOTE[k]; if(!em||now()>em.until) return false;

}

function poseOf(k,o){
  if(talk&&talk.k===k) return talk.pose;
  if(react&&now()<react.until) return REACT[react.mode][k];
  if(o.moving) return CREW[k].move;
  return CREW[k].idle[o.idle%CREW[k].idle.length];
}
function drawChar(g,k,x,y,t,o){
  const c=CREW[k], pose=poseOf(k,o), img=IMG[pose], m=POSE[pose]; if(!img||!m) return null;
  const s=c.h/POSE[c.base].h, w=m.w*s, h=m.h*s;
  let bob=c.float? Math.sin(t*2.6+o.ph)*4-12 : (o.moving? -Math.abs(Math.sin(o.step*11))*4 : Math.sin(t*2+o.ph)*1);
  if(react&&now()<react.until&&react.mode!=="bad") bob-=Math.abs(Math.sin(t*9+o.ph))*(react.mode==="jack"?10:6);
  const shake=isAlarm()? Math.sin(t*40+o.ph)*1.6 : 0;
  g.fillStyle="rgba(0,0,0,.36)"; g.beginPath(); g.ellipse(x,y-2,Math.min(w,c.h*.9)*0.3,6,0,0,7); g.fill();
  g.save(); g.translate(x+shake,y+bob); if(o.dir<0) g.scale(-1,1);

  const ax=m.ax*w; g.drawImage(img,-ax,-h,w,h); g.restore();

}

const keys={};
const KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
let active=false;
cv.addEventListener("focus",()=>active=true);
cv.addEventListener("blur",()=>{active=false; for(const k in keys) keys[k]=false});
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeDlg(); return; }
  if(!active) return;
  if(KM[e.key]){ keys[KM[e.key]]=true; player.path=null; e.preventDefault(); }
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); if(talk) nextLine(); else if(near) inspect(near); }
});
window.addEventListener("keyup",e=>{ if(KM[e.key]) keys[KM[e.key]]=false });
document.querySelectorAll(".pad button").forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener("pointerdown",e=>{e.preventDefault(); keys[k]=true; player.path=null});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));
});
const foot=(x,y)=>{ const w=SC.walkPt; return w(x-12,y)&&w(x+12,y)&&w(x-12,y-8)&&w(x+12,y-8); };
cv.addEventListener("pointerdown",e=>{
  cv.focus({preventScroll:true}); if(travelling) return;
  const r=cv.getBoundingClientRect(), wx=cam.x+(e.clientX-r.left)/zoom, wy=cam.y+(e.clientY-r.top)/zoom;
  const hit=[...heads].reverse().find(h=>wx>=h.x0-6&&wx<=h.x1+6&&wy>=h.top-10&&wy<=h.y+6);
  if(hit){ const pk=registerPoke(hit.k); if(pk) showExpr(hit.k,pk,true); else startTalk(hit.k); return; }
  const target=SC.spots.find(s=>inR(wx,wy,s.r))||null;
  walkTo(target?target.x:wx,target?target.y:wy,target);
});
function walkTo(x,y,target){
  const path=findPath(player.x,player.y,x,y);
  if(path){ player.path=path; if(target) player.path.push([target.x,target.y]); player.goal=target; }
}
function findPath(sx,sy,tx,ty){
  const c=v=>Math.max(0,Math.floor(v/CELL)), GC=SC.gc, GR=SC.gr, grid=SC.grid;
  let gx=Math.min(GC-1,c(tx)), gy=Math.min(GR-1,c(ty));
  if(!grid[gy]?.[gx]){ let best=null,bd=1e9; for(let j=0;j<GR;j++)for(let i=0;i<GC;i++) if(grid[j][i]){const d=(i-gx)**2+(j-gy)**2; if(d<bd){bd=d;best=[i,j]}} if(!best) return null; [gx,gy]=best; }
  const st=[Math.min(GC-1,c(sx)),Math.min(GR-1,c(sy))], start=st[1]*GC+st[0], goal=gy*GC+gx, prev=new Map([[start,-1]]), q=[start];
  while(q.length){ const cur=q.shift(); if(cur===goal){ const out=[]; let k=cur; while(k!==start&&k!==-1){ out.unshift([(k%GC)*CELL+CELL/2,Math.floor(k/GC)*CELL+CELL/2]); k=prev.get(k);} return out; }
    const cx=cur%GC, cy=Math.floor(cur/GC);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+dx, ny=cy+dy, nk=ny*GC+nx; if(nx<0||ny<0||nx>=GC||ny>=GR||!grid[ny][nx]||prev.has(nk)) continue; prev.set(nk,cur); q.push(nk);} }
  return null;
}
function nearestSpot(){ let best=null,bd=1e9; for(const s of SC.spots){ const d=Math.hypot(player.x-s.x,player.y-s.y); if(d<bd){bd=d;best=s} } return bd<70?best:null; }
let lastLine=0;
const act=document.getElementById("act");
function setActLabel(){ act.textContent=near? T("inspect_x",{x:near.lab().split(" · ")[0]}) : T("inspect"); }
let doorOpen=0;
function update(dt,t){
  let vx=0,vy=0; const sp=190;
  elevDoor+=(((elevNear()||elevForce)?1:0)-elevDoor)*Math.min(1,dt*5);
  doorOpen+=((SC.id==="F1"&&player.y>600&&player.y<840&&Math.abs(player.x-690)<140?1:0)-doorOpen)*Math.min(1,dt*6);
  if(travelling){ for(const k in keys) keys[k]=false; player.path=null; }
  if(keys.left)vx-=1; if(keys.right)vx+=1; if(keys.up)vy-=1; if(keys.down)vy+=1;
  if(!vx&&!vy&&player.path&&player.path.length){
    const [tx,ty]=player.path[0], dx=tx-player.x, dy=ty-player.y, d=Math.hypot(dx,dy);
    if(d<5){ player.path.shift(); if(!player.path.length&&player.goal){ inspect(player.goal); player.goal=null; } }
    else { vx=dx/d; vy=dy/d; }
  }
  if(vx&&vy&&!player.path){vx*=.7071;vy*=.7071}
  const nx=player.x+vx*sp*dt, ny=player.y+vy*sp*dt;
  if(foot(nx,player.y)||player.path) player.x=nx;
  if(foot(player.x,ny)||player.path) player.y=ny;
  if(vx) player.dir=vx<0?-1:1;
  player.moving=!!(vx||vy); if(player.moving) player.step+=dt;
  NPC.forEach(n=>{
    n.next-=dt; if(n.next<=0){ n.goal=n.goal?0:(Math.random()<.5?-1:1)*22; n.next=6+Math.random()*6; }
    const d=n.goal-n.off; if(Math.abs(d)>.6){ n.off+=Math.sign(d)*28*dt; n.dir=Math.sign(d)||n.dir; }
    n.x=n.hx+n.off;
    n.idleT-=dt; if(n.idleT<=0){ n.idle++; n.idleT=5+Math.random()*4; }
  });
  if(t-lastLine>(isAlarm()?1.6:4.2)){ lastLine=t; NPC.forEach(n=>n.line++); }
  idleEmotes(dt);
  for(const p of fx){ p.age+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; } fx=fx.filter(p=>p.age<p.life);
  if(talk&&now()-talk.at>14) closeDlg();
  const s=nearestSpot(); if(s!==near){ near=s; act.disabled=!near; setActLabel(); }
  game.classList.toggle("alarm",isAlarm()); game.classList.toggle("gold",isGold());
}

/* ---------- elevator ---------- */
const elevEl=document.getElementById("elev"), transEl=document.getElementById("trans");
function openElev(){
  closeDlg(); elevForce=1; elevEl.hidden=false; document.getElementById("eMsg").textContent=""; renderElev();
  const cur=elevEl.querySelector('[aria-current="true"]'); (cur||elevEl.querySelector("button")).focus({preventScroll:true});
}
function closeElev(){ elevEl.hidden=true; elevForce=0; cv.focus({preventScroll:true}); }
function renderElev(){
  document.getElementById("eLed").textContent=FLOORS.find(f=>f.id===SC.id).code;
  document.getElementById("floors").innerHTML=FLOORS.map(f=>{ const cur=f.id===SC.id;
    return `<button class="fl${f.open?"":" lock"}${cur?" cur":""}" data-f="${f.id}" ${cur?'aria-current="true"':""}><span class="code">${f.code}</span><span class="fn">${esc(L(f.name))}</span><span class="st">${cur?esc(T("el_now")):f.open?"":"🔒 "+esc(T("el_locked"))}</span></button>`; }).join("");
}
document.getElementById("floors").addEventListener("click",e=>{
  const b=e.target.closest(".fl"); if(!b) return; const f=FLOORS.find(x=>x.id===b.dataset.f);
  if(f.id===SC.id){ document.getElementById("eMsg").textContent=T("el_now")+" · "+L(f.name); return; }
  if(!f.open){ const m=document.getElementById("eMsg"); m.textContent="⛔ "+T("el_locked_msg",{f:`${f.code} ${L(f.name)}`}); b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); emote(playerKey,"E18",2.6); return; }
  travel(f);
});
document.getElementById("eX").addEventListener("click",closeElev);
async function travel(f){
  if(travelling) return; travelling=true; elevEl.hidden=true; info.hidden=true; lastInfo=null;
  const from=FLOORS.find(x=>x.id===SC.id);
  const reduceMo=matchMedia("(prefers-reduced-motion: reduce)").matches;
  elevForce=0; await wait(reduceMo?0:450);
  transEl.hidden=false; transEl.classList.remove("in"); void transEl.offsetWidth; transEl.classList.add("in");
  const led=document.getElementById("tLed"), msg=document.getElementById("tMsg");
  msg.textContent=T("el_moving",{f:`${f.code} ${L(f.name)}`});
  const dir=FLOORS.indexOf(f)>FLOORS.indexOf(from)?"▼":"▲";
  led.textContent=from.code; await wait(reduceMo?200:600); led.textContent=dir; await wait(reduceMo?100:450);
  SC=SCENES[f.id]; ostScene(f.id); const e=elevOf(); player.x=e.x; player.y=e.doorY+56; player.path=null; player.goal=null; near=null; draw.init=0; resize();
  led.textContent=f.code; msg.textContent=T("el_arrive",{f:`${f.code} ${L(f.name)}`});
  await wait(reduceMo?200:550);
  transEl.hidden=true; elevForce=1; travelling=false; setTimeout(()=>{ if(!elevEl.hidden) return; elevForce=0; },1200);
  toast(T("el_arrive",{f:`${f.code} ${L(f.name)}`}),"good"); emote(playerKey,f.id==="B1"?"E19":"E13",3);
  if(f.id==="B1") coreInfo(); else welcome();
  cv.focus({preventScroll:true});
}

/* ======================================================================
   toast
   ====================================================================== */
let toastT=0;
function toast(msg,kind){ const el=document.getElementById("toast"); el.textContent=msg; el.className="toast "+(kind||""); el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2600); }

/* ======================================================================
   counters: Google Apps Script when configured, else this browser
   ====================================================================== */
const STATS={clicks:0,acc:0,jack:0,mine:0,mode:"local"};
const LS={get(k){try{return Number(localStorage.getItem(k)||0)}catch(e){return 0}},set(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}};
async function counterInit(){
  STATS.mine=LS.get("alt_mine");
  if(CFG.COUNTER_URL){ try{ const r=await fetch(CFG.COUNTER_URL+"?action=get"); const j=await r.json(); STATS.clicks=j.clicks|0; STATS.acc=j.accidents|0; STATS.jack=j.jackpots|0; STATS.mode="remote"; renderStats(); return; }catch(e){} }
  STATS.clicks=LS.get("alt_clicks"); STATS.acc=LS.get("alt_acc"); STATS.jack=LS.get("alt_jack"); STATS.mode="local"; renderStats();
}
async function counterHit(ev,result,level){
  STATS.mine++; LS.set("alt_mine",STATS.mine);
  STATS.clicks++; if(result==="accident") STATS.acc++; if(result==="jackpot") STATS.jack++;
  renderStats(result);
  if(STATS.mode==="remote"){
    try{ const r=await fetch(`${CFG.COUNTER_URL}?action=hit&event=${ev}&result=${result}&accident=${result==="accident"?1:0}&level=${level}`); const j=await r.json(); STATS.clicks=Math.max(STATS.clicks,j.clicks|0); STATS.acc=Math.max(STATS.acc,j.accidents|0); STATS.jack=Math.max(STATS.jack,j.jackpots|0); renderStats(); }catch(e){}
  } else { LS.set("alt_clicks",STATS.clicks); LS.set("alt_acc",STATS.acc); LS.set("alt_jack",STATS.jack); }
}
function bump(el){ el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
function renderStats(result){
  const c=document.getElementById("sClicks"), a=document.getElementById("sAcc"), j=document.getElementById("sJack");
  c.textContent=STATS.clicks.toLocaleString(); a.textContent=STATS.acc.toLocaleString(); j.textContent=STATS.jack.toLocaleString();
  const pct=n=>(n/STATS.clicks*100).toFixed(1);
  document.getElementById("sRate").textContent=STATS.clicks? T("rate",{r:pct(STATS.acc)}) : T("rate",{r:"–"});
  document.getElementById("sJRate").textContent=STATS.clicks? T("jrate",{r:pct(STATS.jack)}) : T("jrate",{r:"–"});
  document.getElementById("sMode").textContent=T(STATS.mode==="remote"?"mode_remote":"mode_local");
  document.getElementById("sMine").textContent=T("mine",{n:STATS.mine});
  if(result){ bump(c); if(result==="accident") bump(a); if(result==="jackpot") bump(j); }
}

/* ======================================================================
   experiment console: countdown 3 → result for 3 s → back to normal
   ====================================================================== */
let evSel="e1";
const evs=document.getElementById("evs"), lvl=document.getElementById("lvl"), go=document.getElementById("go");
const cd=document.getElementById("cd"), cdN=document.getElementById("cdN"), res=document.getElementById("res");
function renderEvs(){
  evs.innerHTML=EVENTS.map(e=>`<button class="ev" data-id="${e.id}" aria-pressed="${e.id===evSel}"><img src="${P}${e.pose}.webp" alt=""><span style="min-width:0"><b>${esc(L(e.name))}</b><small>${esc(zoneLabel(e))}</small></span></button>`).join("");
  updRisk();
}
function updRisk(){
  const e=EVENTS.find(x=>x.id===evSel), l=+lvl.value;
  document.getElementById("lvlOut").textContent=`${l} · ${L(UI.levels)[l-1]}`;
  const p=`<b>${Math.round(riskOf(e,l)*100)}</b>`;
  document.getElementById("risk").innerHTML=esc(T("risk",{z:zoneLabel(e),n:L(e.name),p:"\u0000"})).split("\u0000").join(p);
}
evs.addEventListener("click",e=>{ const b=e.target.closest(".ev"); if(!b||running) return; evSel=b.dataset.id; renderEvs(); });
lvl.addEventListener("input",updRisk);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
go.addEventListener("click",async()=>{
  if(SC.id!=="F1"){ toast(T("con_f1"),"bad"); game.scrollIntoView({block:"center"}); return; }
  if(running) return; running=true; go.disabled=true;
  const e=EVENTS.find(x=>x.id===evSel), l=+lvl.value, p=riskOf(e,l), r=Math.random();
  const outcome = r<p ? "accident" : r<2*p ? "jackpot" : "ok";
  closeDlg(); res.hidden=true;
  const reduceMo=matchMedia("(prefers-reduced-motion: reduce)").matches;
  game.scrollIntoView({behavior:reduceMo?"auto":"smooth",block:"center"});
  cine={x:e.x,y:e.y+120,ex:e.x,ey:e.y+40,until:now()+6.4};
  // countdown
  emoteAll({doc:"E20",asst:"E15",fly:"E09",robo:"E09"},3.4);
  cd.hidden=false; document.getElementById("cdL").textContent=T("cd_label"); document.getElementById("cdE").textContent=`${zoneLabel(e)} · ${L(e.name)}`;
  for(const n of [3,2,1]){ cdN.className="n"; void cdN.offsetWidth; cdN.textContent=n; await wait(1000); }
  cdN.className="n go"; void cdN.offsetWidth; cdN.textContent=T("cd_go"); await wait(350); cd.hidden=true;
  // result for 3 seconds
  const mode = outcome==="accident"?"bad":outcome==="jackpot"?"jack":"good";
  spawnFx(e.x,e.y+60,mode);
  counterHit(e.id,outcome,l);
  react={mode,until:now()+3};
  emoteAll(outcome==="accident"?{doc:"E24",asst:"E21",fly:"E05",robo:"E24"}:outcome==="jackpot"?{doc:"E19",asst:"E19",fly:"E19",robo:"E19"}:{doc:"E10",asst:"E01",fly:"E16",robo:"E01"},3.2);
  if(outcome==="accident"){
    fxMode="bad"; fxUntil=now()+3;
    toast(T("t_bad",{z:zoneLabel(e),n:L(e.name)}),"bad");
    showRes(false,T("b_acc",{n:STATS.acc}),A+e.cut,L(e.acc));
    setInfo(`<span class="badge b-alarm">${esc(T("b_acc",{n:STATS.acc}))}</span><h3>${esc(L(e.acc))}</h3><div class="row">${pimg("robo_alert")}<div class="meta" style="flex:1;min-width:0">${esc(T("acc_body",{z:zoneLabel(e),l,lv:L(UI.levels)[l-1]}))}</div></div>`);
  } else if(outcome==="jackpot"){
    fxMode="jack"; fxUntil=now()+3;
    toast(T("t_jack",{z:zoneLabel(e),n:L(e.name)}),"jack");
    showRes(true,T("b_jack",{n:STATS.jack}),A+"group_large.webp",L(e.jack));
    setInfo(`<span class="badge b-gold">${esc(T("b_jack",{n:STATS.jack}))}</span><h3>${esc(L(e.jack))}</h3><div class="row">${pimg("robo_dance")}<div class="meta" style="flex:1;min-width:0">${esc(T("jack_body",{z:zoneLabel(e),l,lv:L(UI.levels)[l-1]}))}</div></div>`);
  } else {
    fxMode=null; toast(T("t_good",{n:L(e.name)}),"good");
  }
  await wait(3000);
  // back to normal
  res.hidden=true; fxMode=null; fxUntil=0; react=null; cine=null;
  if(outcome!=="ok") toast(T("normal"),"good");
  running=false; go.disabled=false;
});
function showRes(gold,tagText,img,cap){
  res.className="res"+(gold?" gold":""); document.getElementById("resTag").textContent=tagText;
  const im=document.getElementById("resImg"); im.src=img; im.alt=cap; document.getElementById("resCap").textContent=cap;
  const bar=document.getElementById("resBar"); bar.style.animation="none"; void bar.offsetWidth; bar.style.animation="";
  res.hidden=false;
}

sels.forEach(s=>{ s.innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join(""); s.addEventListener("change",()=>setLang(s.value)); });

  setActLabel(); renderEvs(); renderPicker(); renderLists(); renderStats(); ostUI();
  if(talk){ if(talk.free) { setPortrait(talk.k,talk.e); dNm.textContent=crewName(talk.k); dRl.textContent=crewRole(talk.k); typeLine(exprLine(talk.k,talk.e),false); } else showLine(false); }
  if(lastInfo){ if(lastInfo.welcome) welcome(); else if(lastInfo.expr) exprGallery(lastInfo.expr); else if(lastInfo.tg) tgInfo(); else if(lastInfo.spot){ const s=spotById(lastInfo.spot); if(s) inspect(s); } }
  if(!elevEl.hidden) renderElev();
}
function setLang(l){ lang=l; try{localStorage.setItem("alt_lang",l)}catch(e){} applyLang(); }

/* ======================================================================
   loop + boot
   ====================================================================== */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let last=0;
function frame(ms){ const t=ms/1000, dt=Math.min(.05,t-(last||t)); last=t; update(dt,t); draw(reduce?0:t); requestAnimationFrame(frame); }
const getJSON=async(u,fb)=>{ try{ const r=await fetch(u,{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){} return fb; };
async function boot(){
  const [pj,resd,cfg]=await Promise.all([pjLoad("projects.csv",FALLBACK_CSV),getJSON("research.json",FALLBACK_RES),getJSON("config.json",null)]);
  if(cfg) Object.assign(CFG,cfg);
  SRV=await svLoad([CFG.SERVER_CSV_URL,"servers.csv"],FALLBACK_SRV);
  await ostLoad(CFG.OST_PLAYLIST_URL||"ost/ost.csv"); ostBind(); ostUI();
  buildHall(); buildB1(); if(document.fonts) document.fonts.ready.then(()=>{ buildHall(); });
  TASKS=pj.list; PJ_OK=pj.ok; RES=resd;
  buildNPC(); resize(); welcome(); applyLang(); counterInit();
  await Promise.all([["map","map@2x.webp"],["map_ov","map_overload@2x.webp"]].map(([k,f])=>load(k,A+f)).concat(Object.keys(POSE).map(p=>load(p,P+p+".webp"))));
  ["cut1_panic","cut2_robot","cut3_gpu","cut4_fly","doc_large","group_large"].forEach(f=>{const i=new Image(); i.src=A+f+".webp"});
  requestAnimationFrame(frame);
}
boot();
