<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahn Lab Projects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column work board. Header (language top) → four counts → filters → timeline (scrolls sideways on phones) → in progress / planned / done → Telegram + footer (language bottom). Same night-lab palette as Lab Town; single dark theme by choice. */
:root{
  --bg:#12101c; --panel:#1b1729; --panel-2:#2a1f3d; --line:#3a2f55;
  --fg:#eeeaf8; --muted:#a59dc2; --cyan:#4de0d0; --amber:#e8a24b; --alarm:#e02a3c;
  --todo:#e8a24b; --doing:#4de0d0; --done:#b59bff;
  --display:"Do Hyeon","IBM Plex Sans KR","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic",system-ui,sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:18px}
a{color:var(--cyan)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
button,select,input{font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 12px 5px 6px}
.back img{width:26px;height:26px;object-fit:contain}
.back:hover{border-color:var(--cyan)}
.langsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.langsel select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;cursor:pointer}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
h1{font-family:var(--display);font-weight:400;margin:0;line-height:1.15;font-size:clamp(30px,5vw,44px);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;margin:0;font-size:24px;display:flex;align-items:center;gap:10px}
.lead{color:var(--muted);margin:6px 0 0;max-width:68ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.hero .crew{display:flex;align-items:flex-end}
.hero .crew img{height:96px;width:auto;margin-left:-14px}
.warn{font-size:13px;color:#ffd59a;border:1px dashed #6b4f22;border-radius:10px;padding:6px 12px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;border-top:3px solid var(--line);min-width:0}
.stat.doing{border-top-color:var(--doing)}.stat.todo{border-top-color:var(--todo)}.stat.done{border-top-color:var(--done)}.stat.due{border-top-color:var(--alarm)}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:32px;line-height:1.15;font-variant-numeric:tabular-nums}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:1fr}.hero .crew img{height:70px}}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);background:#173a3a}
.chip .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.search{background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:7px 12px;font-size:14px;min-width:0;width:min(280px,100%)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tl-wrap{overflow-x:auto;margin-top:10px}
.tl{position:relative;min-width:760px}
.tl .months{display:grid;font-family:var(--mono);font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);margin-left:var(--lw)}
.tl .months span{padding:2px 6px;border-left:1px solid var(--line)}
.tl .row{display:grid;grid-template-columns:var(--lw) minmax(0,1fr);align-items:center;min-height:30px}
.tl .row .nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px;display:flex;align-items:center;gap:6px}
.tl .row .nm img{width:20px;height:20px;object-fit:contain;flex:0 0 20px}
.tl .track{position:relative;height:30px}
.tl .bar{position:absolute;top:8px;height:14px;border-radius:7px;background:var(--todo);opacity:.9;min-width:6px}
.tl .bar.doing{background:linear-gradient(90deg,var(--doing) var(--p),#2a6e67 var(--p))}
.tl .bar.done{background:var(--done);opacity:.6}
.tl .today{position:absolute;top:0;bottom:0;width:2px;background:var(--alarm);pointer-events:none}
.tl .today b{position:absolute;top:-1px;left:4px;white-space:nowrap;font-family:var(--mono);font-size:10px;color:#ff8f99;font-weight:500}
.tl .grid{position:absolute;top:0;bottom:0;border-left:1px dashed rgba(58,47,85,.6);pointer-events:none}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.list{display:grid;gap:10px;margin-top:10px}
.card{background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start}
.card.doing{border-left-color:var(--doing)}.card.todo{border-left-color:var(--todo)}.card.done{border-left-color:var(--done)}
.card .av{width:44px;height:52px;object-fit:contain}
.card h3{margin:0;font-size:16px;line-height:1.35;font-weight:500}
.card h3 a{color:var(--fg);text-decoration:none;border-bottom:1px solid rgba(77,224,208,.5)}
.card h3 a:hover{color:var(--cyan)}
.card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:3px}
.card .cat{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 8px}
.card .note{font-size:13px;color:var(--muted);margin-top:6px}
.card .dd{font-family:var(--mono);font-size:12px;color:var(--amber)}
.card .dd.over{color:#ff8f99}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--doing)}
.done-list{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:820px){.done-list{grid-template-columns:1fr}}
.done-list li{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.done-list img{width:30px;height:34px;object-fit:contain;flex:0 0 30px}
.done-list .t{min-width:0}
.done-list a{color:var(--fg)}
.done-list small{display:block;color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:14px;margin:10px 0 0}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.tg{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.tg img{width:56px;height:70px;object-fit:contain}
.tg h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.soon{font-size:11px;font-family:var(--mono);border:1px solid var(--amber);color:#ffd59a;border-radius:999px;padding:0 8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;text-decoration:none;color:var(--fg);background:var(--panel-2)}
.btn.pri{background:var(--cyan);color:#0a2622;border-color:var(--cyan);font-weight:500}
.btn[aria-disabled="true"]{opacity:.55}
@media (max-width:640px){.tg{grid-template-columns:auto minmax(0,1fr)}.tg .act{grid-column:1/-1}}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html"><img src="assets/pose/robo_delivery.webp" alt=""><span data-i18n="back"></span></a>
    <label class="langsel"><span aria-hidden="true">🌐</span><span data-i18n="lang"></span><select id="langTop" aria-label="Language"></select></label>
  </div>

  <header class="hero">
    <div>
      <div class="eyebrow" data-i18n="p_eyebrow"></div>
      <h1 data-i18n="p_h1"></h1>
      <p class="lead" data-i18n="p_lead"></p>
    </div>
    <div class="crew" aria-hidden="true"><img src="assets/pose/doc_write.webp" alt=""><img src="assets/pose/asst_present.webp" alt=""><img src="assets/pose/fly_report.webp" alt=""><img src="assets/pose/robo_delivery.webp" alt=""></div>
  </header>
  <p class="warn" id="warn" hidden data-i18n="p_csv_err"></p>

  <section class="stats" aria-label="summary">
    <div class="stat doing"><div class="k" data-i18n="p_doing"></div><div class="v" id="nDoing">0</div></div>
    <div class="stat todo"><div class="k" data-i18n="p_todo"></div><div class="v" id="nTodo">0</div></div>
    <div class="stat done"><div class="k" data-i18n="p_done"></div><div class="v" id="nDone">0</div></div>
    <div class="stat due"><div class="k" data-i18n="p_due30"></div><div class="v" id="nDue">0</div></div>
  </section>

  <div class="filters">
    <div class="chips" id="cats" role="group"></div>
    <input class="search" id="q" type="search" autocomplete="off">
  </div>

  <section class="box" aria-labelledby="hTl">
    <h2 id="hTl"><span data-i18n="p_timeline"></span></h2>
    <div class="tl-wrap"><div class="tl" id="tl"></div></div>
  </section>

  <div class="cols">
    <section class="box" aria-labelledby="hDoing"><h2 id="hDoing"><span class="dot" style="background:var(--doing)"></span><span data-i18n="p_doing"></span> <span class="count" id="cDoing"></span></h2><div class="list" id="lDoing"></div></section>
    <section class="box" aria-labelledby="hTodo"><h2 id="hTodo"><span class="dot" style="background:var(--todo)"></span><span data-i18n="p_todo"></span> <span class="count" id="cTodo"></span></h2><div class="list" id="lTodo"></div></section>
  </div>
  <section class="box" aria-labelledby="hDone"><h2 id="hDone"><span class="dot" style="background:var(--done)"></span><span data-i18n="p_done"></span> <span class="count" id="cDone"></span></h2><ul class="done-list" id="lDone"></ul></section>

  <section class="box tg" aria-labelledby="hTg">
    <img src="assets/pose/asst_type.webp" alt="">
    <div><h3 id="hTg"><span data-i18n="tg_btn"></span><span class="soon" id="tgSoon" data-i18n="tg_soon"></span></h3><div class="meta" data-i18n="tg_desc" style="font-size:13px;color:var(--muted)"></div></div>
    <div class="act" id="tgAct"></div>
  </section>

  <footer>
    <span data-i18n="p_source"></span>
    <label class="langsel"><span aria-hidden="true">🌐</span><span data-i18n="lang"></span><select id="langBottom" aria-label="Language"></select></label>
    <a href="index.html" data-i18n="back"></a>
  </footer>
</div>

// Accepts Excel CSV in UTF-8 or Korean ANSI (CP949/EUC-KR); Korean or English headers.
const PJ_HEAD={
  status:["상태","status"], category:["카테고리","분류","category"], name:["프로젝트명","이름","name","project"],
  link:["프로젝트링크","링크","link","url"], start:["시작일","시작","start"], end:["완료일","마감일","종료일","end","due"],
  owner:["담당","담당자","owner"], progress:["진행률","progress"], note:["비고","메모","note","notes"]
};
const PJ_LANGS=["en","zh","ja","uz","ru"];
function pjDecode(buf){
  const u8=new Uint8Array(buf);
  try{ return new TextDecoder("utf-8",{fatal:true}).decode(u8).replace(/^﻿/,""); }
  catch(e){ try{ return new TextDecoder("euc-kr").decode(u8); }catch(e2){ return new TextDecoder().decode(u8); } }
}
function pjParseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function pjDate(s){
  s=String(s||"").trim(); if(!s) return null;
  const m=s.match(/^(\d{4})[-./년\s]*(\d{1,2})[-./월\s]*(\d{1,2})/); if(!m) return null;
  const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?null:d;
}
const pjISO=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:"";
function pjOwner(s){
  s=String(s||"").trim().toLowerCase();
  if(/조수|조교|asst|assistant/.test(s)) return "asst";
  if(/초파리|fly/.test(s)) return "fly";
  if(/robo|로보|money/.test(s)) return "robo";
  return "doc";
}
function pjStatus(s){
  s=String(s||"").replace(/\s/g,"").toLowerCase();
  if(/완료|done|complete|finished/.test(s)) return "done";
  if(/진행|doing|progress|wip/.test(s)) return "doing";
  if(/예정|todo|plan|schedul|준비/.test(s)) return "todo";
  return "";
}
function pjBuild(text){
  const rows=pjParseCSV(text); if(rows.length<2) return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col={}; for(const k in PJ_HEAD) col[k]=head.findIndex(h=>PJ_HEAD[k].some(a=>a.toLowerCase()===h));
  const tr={}; PJ_LANGS.forEach(l=>{ tr[l]=head.findIndex(h=>h==="프로젝트명_"+l||h==="name_"+l); });
  const today=new Date(); today.setHours(0,0,0,0);
  const out=[];
  rows.slice(1).forEach((r,i)=>{
    const g=k=>col[k]>=0?String(r[col[k]]??"").trim():"";
    const name=g("name"); if(!name) return;
    const start=pjDate(g("start")), end=pjDate(g("end"));
    let status=pjStatus(g("status"));
    if(!status){ status = end&&end<today ? "done" : start&&start>today ? "todo" : (start||end) ? "doing" : "todo"; }
    let progress=g("progress")!==""? Math.max(0,Math.min(100,parseFloat(g("progress"))||0)) : null;
    if(progress==null){
      if(status==="done") progress=100;
      else if(status==="doing"&&start&&end&&end>start) progress=Math.round(Math.max(0,Math.min(1,(today-start)/(end-start)))*100);
    }
    const i18n={}; PJ_LANGS.forEach(l=>{ if(tr[l]>=0&&String(r[tr[l]]||"").trim()) i18n[l]={title:String(r[tr[l]]).trim()}; });
    out.push({id:"p"+(i+1),status,category:g("category"),title:name,link:g("link"),start,end,owner:pjOwner(g("owner")),ownerRaw:g("owner"),progress,note:g("note"),i18n});
  });
  return out;
}
async function pjLoad(url,fallback){
  try{ const r=await fetch(url,{cache:"no-store"}); if(r.ok){ const list=pjBuild(pjDecode(await r.arrayBuffer())); if(list.length) return {list,ok:true}; } }catch(e){}
  return {list:pjBuild(fallback),ok:false};
}

const today=new Date(); today.setHours(0,0,0,0);
const DAY=864e5;

const pass=p=>(!cat||p.category===cat)&&(!q||(title(p)+" "+p.title+" "+p.category+" "+p.note).toLowerCase().includes(q));
const days=(a,b)=>Math.round((a-b)/DAY);

function render(){
  const all=LIST, vis=all.filter(pass);
  const by=s=>vis.filter(p=>p.status===s);
  document.getElementById("nDoing").textContent=all.filter(p=>p.status==="doing").length;
  document.getElementById("nTodo").textContent=all.filter(p=>p.status==="todo").length;
  document.getElementById("nDone").textContent=all.filter(p=>p.status==="done").length;
  document.getElementById("nDue").textContent=all.filter(p=>p.status!=="done"&&p.end&&days(p.end,today)>=0&&days(p.end,today)<=30).length;
  // categories
  const cats=[...new Set(all.map(p=>p.category).filter(Boolean))];
  document.getElementById("cats").innerHTML=[["",T("p_all"),all.length]].concat(cats.map(c=>[c,catL(c),all.filter(p=>p.category===c).length])).map(([v,l,n])=>`<button class="chip" data-c="${esc(v)}" aria-pressed="${cat===v}">${esc(l)}<span class="n">${n}</span></button>`).join("");
  // lists
  const doing=by("doing").sort((a,b)=>(a.end||9e15)-(b.end||9e15)), todo=by("todo").sort((a,b)=>(a.start||9e15)-(b.start||9e15)), done=by("done").sort((a,b)=>(b.end||0)-(a.end||0));
  document.getElementById("cDoing").textContent=doing.length; document.getElementById("cTodo").textContent=todo.length; document.getElementById("cDone").textContent=done.length;
  document.getElementById("lDoing").innerHTML=doing.length? doing.map(card).join("") : `<p class="empty">${esc(T("p_empty"))}</p>`;
  document.getElementById("lTodo").innerHTML=todo.length? todo.map(card).join("") : `<p class="empty">${esc(T("p_empty"))}</p>`;
  document.getElementById("lDone").innerHTML=done.length? done.map(p=>`<li><img src="assets/pose/${DONE_AV[p.owner]}.webp" alt=""><div class="t">${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(title(p))}</a>`:esc(title(p))}<small>${esc([owner(p),catL(p.category),p.end?pjISO(p.end):"",p.note].filter(Boolean).join(" · "))}</small></div></li>`).join("") : `<li class="empty" style="background:none;border:0">${esc(T("p_empty"))}</li>`;
  timeline(doing.concat(todo).filter(p=>p.start||p.end));
}
function card(p){
  const dates = p.start||p.end ? `${p.start?pjISO(p.start):"…"} → ${p.end?pjISO(p.end):"…"}` : T("p_nodate");
  let dd="";
  if(p.status==="doing"&&p.end){ const n=days(p.end,today); dd = n<0? `<span class="dd over">${esc(T("p_over",{n:-n}))}</span>` : `<span class="dd">${n===0?"D-day":"D-"+n}</span>`; }
  if(p.status==="todo"&&p.start){ const n=days(p.start,today); if(n>0) dd=`<span class="dd">${esc(T("p_in",{n}))}</span>`; }
  const t=title(p);
  return `<article class="card ${p.status}"><img class="av" src="assets/pose/${AV[p.owner]}.webp" alt="${esc(owner(p))}"><div style="min-width:0">
    <h3>${p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(t)}</a>`:esc(t)}</h3>
    <div class="meta">${p.category?`<span class="cat">${esc(catL(p.category))}</span>`:""}<span>${esc(owner(p))}</span><span>${esc(dates)}</span>${dd}</div>
    ${p.status==="doing"&&p.progress!=null?`<div class="prog" role="progressbar" aria-valuenow="${p.progress}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p.progress}%"></i></div><div class="meta">${esc(T("prog",{p:p.progress}))}</div>`:""}
    ${p.note?`<div class="note">${esc(p.note)}</div>`:""}
  </div></article>`;
}
function timeline(items){
  const el=document.getElementById("tl");
  if(!items.length){ el.innerHTML=`<p class="empty">${esc(T("p_empty"))}</p>`; return; }
  const s=items.map(p=>p.start||p.end), e=items.map(p=>p.end||p.start);
  let min=new Date(Math.min(today,...s)), max=new Date(Math.max(today,...e));
  min=new Date(min.getFullYear(),min.getMonth(),1); max=new Date(max.getFullYear(),max.getMonth()+1,1);
  const months=[]; for(let d=new Date(min); d<max; d=new Date(d.getFullYear(),d.getMonth()+1,1)) months.push(new Date(d));
  const span=max-min, pos=d=>((d-min)/span*100);
  const lw=window.innerWidth<640?"150px":"240px";
  const fmtM=d=>lang==="ko"||lang==="zh"||lang==="ja"? `${d.getFullYear()}.${d.getMonth()+1}` : d.toLocaleDateString(lang==="uz"?"uz-Latn":lang,{year:"2-digit",month:"short"});
  const mcols=months.map(m=>{ const n=new Date(m.getFullYear(),m.getMonth()+1,1); return (n-m)/span*100; });
  el.style.setProperty("--lw",lw);
  el.innerHTML=`<div class="months" style="grid-template-columns:${mcols.map(w=>w+"fr").join(" ")}">${months.map(m=>`<span>${esc(fmtM(m))}</span>`).join("")}</div>`+
    items.map(p=>{ const a=p.start||p.end, b=p.end||p.start; const l=pos(a), w=Math.max(.8,pos(b)-l);
      return `<div class="row"><div class="nm" title="${esc(title(p))}"><img src="assets/pose/${AV[p.owner]}.webp" alt="">${esc(title(p))}</div><div class="track">
        ${months.map(m=>`<span class="grid" style="left:${pos(m)}%"></span>`).join("")}
        <span class="bar ${p.status}" style="left:${l}%;width:${w}%;--p:${p.progress??0}%" title="${esc(title(p))} · ${pjISO(a)} → ${pjISO(b)}"></span>
        <span class="today" style="left:${pos(today)}%"></span></div></div>`; }).join("")+
    `<div class="row"><div></div><div class="track" style="height:18px"><span class="today" style="left:${pos(today)}%"><b>${esc(T("p_today"))}</b></span></div></div>`;
}

function applyLang(){
